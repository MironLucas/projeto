{% load humanize %}
{% if comparacao %}
  <div class="stat-compare stat-compare--{{ comparacao.direcao }}">
    <span class="stat-compare-pill">
      {% if comparacao.direcao == 'up' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
      {% elif comparacao.direcao == 'down' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
      {% else %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 12h12"></path></svg>
      {% endif %}
      {{ comparacao.valor|intcomma }}
    </span>
    <span class="stat-compare-label">{{ label_comparacao }}</span>
  </div>
{% else %}
  <div class="stat-period">{{ periodo_label }}</div>
{% endif %}
