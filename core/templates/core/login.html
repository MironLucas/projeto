{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora · Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/nexora.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-grid"></div>
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div class="brand-name">NEXORA</div>
        <div class="brand-tagline">Sistema de Relatórios</div>
      </div>

      {% if form.errors %}
        <div class="form-errors">Usuário ou senha inválidos. Tente novamente.</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_username">Usuário</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" name="username" id="id_username" placeholder="mironlucas" autocomplete="username" autofocus required>
          </div>
        </div>
        <div class="form-group">
          <label for="id_password">Senha</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" name="password" id="id_password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <div class="login-footnote">Nexora &copy; {% now "Y" %} · Acesso restrito</div>
    </div>
  </div>
</body>
</html>
