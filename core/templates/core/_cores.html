<div class="swatches">
  {% for cor, nome in cores %}
    <label class="swatch" title="{{ nome }}">
      <input type="radio" name="cor" value="{{ cor }}" aria-label="{{ nome }}"{% if cor == marcada %} checked{% endif %}{% if desativado %} disabled{% endif %}>
      <span style="background: {{ cor }}"></span>
    </label>
  {% endfor %}
</div>
